[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trello-story-importer"
version = "0.1.0"
description = "Importa historias de usuario Markdown a Trello"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
trello-story-importer = "trello_story_importer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
